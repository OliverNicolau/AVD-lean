name = "AbstractVoronoi"
version = "0.2.0"
keywords = ["math", "voronoi", "computational-geometry"]
defaultTargets = ["AbstractVoronoi"]

# The same options Mathlib builds with: no automatic implicit arguments, and the standard
# set of Mathlib style linters (they pass on the whole library).
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

# The planar topology used by this development (the Jordan curve theorem, the
# Jordan–Schönflies theorem) is taken from Tau Ceti (Apache-2.0), pinned at one commit,
# through the single interface file `AbstractVoronoi/Jordan/Backend.lean`. Mathlib is pinned
# at exactly the commit of Tau Ceti's own manifest. Do not run `lake update`.
# The earlier version, built on Álvaro Begué's schoenflies-lean, is tagged `v1-schoenflies`.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "4908b0344e1be5f7e9e5af7f7e640464843a2c84"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[lean_lib]]
name = "AbstractVoronoi"
globs = ["AbstractVoronoi.+"]
